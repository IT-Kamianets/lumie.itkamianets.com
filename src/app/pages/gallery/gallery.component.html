<main class="mx-auto max-w-[var(--container)] px-3 pb-8 pt-3 sm:px-4 sm:pb-10">
	@if (isLoading()) {
		<section
			class="px-4 py-10 text-center sm:px-6 sm:py-14"
			aria-busy="true"
			aria-live="polite"
		>
			<p class="text-sm text-[var(--c-text-muted)]">{{ 'Loading gallery...' | translate }}</p>
		</section>
	} @else if (exhibits().length) {
		<section
			class="overflow-hidden"
		>
			<!-- Header -->
			<div
				class="border-b border-[var(--c-border)] bg-[var(--c-bg-secondary)] px-4 py-5 sm:px-5"
			>
				<h1
					class="text-[24px] font-semibold uppercase tracking-[0.12em] text-[var(--c-secondary)]"
					translate
				>
					Gallery
				</h1>
			</div>

			<!-- Photos Grid -->
			<div class="px-3 py-3 sm:px-4 sm:py-4">
				<div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
					@for (exhibit of exhibits(); track exhibit.slug) {
						<div
							class="group relative overflow-hidden rounded-[1rem]"
						>
							<img
								class="h-48 w-full object-cover transition-transform duration-300 group-hover:scale-105"
								[attr.alt]="exhibit.alt | translate"
								[src]="exhibit.src"
								loading="lazy"
							/>
						</div>
					}
				</div>
			</div>
		</section>
	} @else {
		<section
			class="rounded-[1.2rem] border border-dashed border-[var(--c-border)] bg-[var(--c-bg-secondary)] px-4 py-10 text-center sm:px-6 sm:py-14"
		>
			<p class="mt-2 text-xl font-semibold text-[var(--c-text-secondary)]">
				{{ 'The gallery is currently empty' | translate }}
			</p>
		</section>
	}
</main>
